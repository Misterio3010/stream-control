<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamControl</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; margin: 0; }
        .box { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 400px; margin: 40px auto; border: 1px solid #334155; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { background: #22c55e; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .hidden { display: none; }
        .flex { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginView" class="box">
        <h2>StreamControl</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 15px;">Selecciona tu perfil</p>
        
        <div style="margin-bottom: 15px;">
            <strong>Perfil: Zegarra</strong>
            <input type="password" id="pZ" placeholder="Contraseña (1234)">
            <button onclick="entrar('Zegarra', 'pZ', '1234')">Ingresar como Zegarra</button>
        </div>

        <div>
            <strong>Perfil: Mejia</strong>
            <input type="password" id="pM" placeholder="Contraseña (5678)">
            <button onclick="entrar('Mejia', 'pM', '5678')" style="background: #0284c7;">Ingresar como Mejia</button>
        </div>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="appView" class="hidden box" style="max-width: 600px;">
        <div class="flex">
            <h3>Panel de <span id="lblUser" style="color: #22c55e;"></span></h3>
            <button onclick="salir()" style="background: #ef4444; width: auto; padding: 6px 12px;">Salir</button>
        </div>
        <p style="color: #94a3b8; font-size: 13px; margin-top: 5px;">¡Bienvenido a tu sistema de gestión de streaming!</p>
        <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
        <button onclick="alert('Próximo botón de registro de ventas activo')">+ Registrar Venta</button>
    </div>

    <script>
        function verificar() {
            let user = localStorage.getItem('sc_user');
            if (user) {
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('appView').classList.remove('hidden');
                document.getElementById('lblUser').innerText = user;
            } else {
                document.getElementById('loginView').classList.remove('hidden');
                document.getElementById('appView').classList.add('hidden');
            }
        }

        function entrar(nombre, idInput, claveCorrecta) {
            let val = document.getElementById(idInput).value;
            if (val === claveCorrecta) {
                localStorage.setItem('sc_user', nombre);
                verificar();
            } else {
                alert('Contraseña incorrecta');
            }
        }

        function salir() {
            localStorage.removeItem('sc_user');
            verificar();
        }

        verificar();
    </script>
</body>
</html>
